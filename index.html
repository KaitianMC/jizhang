<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>学习时长</title>
  <link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <section id="p-entry" class="page on">
    <div id="banner" class="banner" hidden>
      <span id="bannerText">建议导出一份备份</span>
      <button id="bannerBtn">备份</button>
      <button id="bannerClose">×</button>
    </div>

    <div class="today">
      <div class="today-num" id="todayTotal">0</div>
      <div class="today-lbl" id="todayLbl">分钟 · 今天还没记录</div>
    </div>

    <div class="meta">
      <input type="date" id="dateInput">
      <input type="text" id="note" placeholder="学了什么（可选）" maxlength="30" enterkeyhint="done">
    </div>

    <div class="dur">
      <span class="dur-val empty" id="durVal">0</span>
      <span class="dur-unit">分钟</span>
    </div>

    <div class="chips" id="chips"></div>

    <div class="keypad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="0">0</button><button data-key="del">⌫</button>
      <button id="saveBtn" class="primary">记下</button>
    </div>
  </section>

  <section id="p-stats" class="page">
    <div class="mnav">
      <button id="prevMonth">‹</button>
      <span class="lbl" id="monthLabel">—</span>
      <button id="nextMonth">›</button>
    </div>

    <div class="card">
      <div class="row2"><span>本月合计</span><strong id="mTotal">0 分钟</strong></div>
      <div class="row2"><span>日均</span><strong id="mAvg">0 分钟</strong></div>
      <div class="sub" id="mSub">—</div>
    </div>

    <div class="card">
      <div class="row2"><span>累计总时长</span><strong id="allTotal">0 分钟</strong></div>
      <div class="sub" id="allSub">—</div>
    </div>

    <div class="card"><h4>每日记录</h4><div id="dayList"></div></div>
  </section>

  <section id="p-settings" class="page">
    <div class="card">
      <h4>数据备份</h4>
      <div class="state" id="dataState"></div>
      <div class="btnrow">
        <button class="btn primary" id="exportBtn">导出备份</button>
        <button class="btn" id="importBtn">导入恢复</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="tip">备份是一个 JSON 文件。导出后建议放到网盘或电脑里，换设备、清理浏览器数据后靠它恢复。</p>
    </div>
    <div class="card">
      <h4>危险操作</h4>
      <button class="btn danger" id="clearBtn">清空所有记录</button>
    </div>
    <p class="tip">v1 · 数据只保存在本设备的浏览器里，不上传任何服务器</p>
  </section>

  <nav class="tabbar">
    <button data-tab="entry" class="on">记录</button>
    <button data-tab="stats">统计</button>
    <button data-tab="settings">设置</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script src="core.js"></script>
<script src="view.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
